[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "improvement-loop"
version = "0.2.0"
description = "A gated, iterative improvement cycle for any software project: critique, verify, rank, plan, build, gate, audit."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
loop = "improvement_loop.cli:main"
improvement-loop = "improvement_loop.cli:main"

[tool.setuptools]
packages = ["improvement_loop"]

[tool.setuptools.package-data]
improvement_loop = ["prompts/*.md", "prompts/lenses/*.md", "*.json"]
